name: 📦 Publish github release

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate release archive
    uses: ./.github/workflows/plugin.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed tag on main and existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import tomllib; p=tomllib.load(open("plugin.toml", "rb"))["plugin"]; print("{}/v{}".format(p["id"], p["version"]))')"
          test "$TAG" = "$expected" || { echo '::error::tag does not match plugin.toml'; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::tag must be on main'; exit 1; }
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
      - name: Upload validated archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          test -s "$ARCHIVE"
          gh release upload "$TAG" "$ARCHIVE" --clobber
