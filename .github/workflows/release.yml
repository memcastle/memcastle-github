name: 📦 Publish github

on:
  push:
    tags:
      - 'github/v*'

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate github
    uses: ./.github/workflows/plugin.yml

  publish:
    name: 🚀 Publish github
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed version tag on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import tomllib; p=tomllib.load(open("plugin.toml", "rb"))["plugin"]; print("{}/v{}".format(p["id"], p["version"]))')"
          test "$GITHUB_REF_NAME" = "$expected" || { echo '::error::tag does not match plugin.toml'; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::tag must be on main'; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo '::error::release already exists; bump plugin.version before publishing'
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
      - name: Publish this provider's validated archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          test -s "$ARCHIVE"
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --generate-notes
