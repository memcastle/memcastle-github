name: 🚀 Prepare github release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      deployment: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Calculate version and release notes
        id: version
        run: python3 scripts/prepare_release.py
      - name: Push release commit
        if: ${{ steps.version.outputs.changed == 'true' && !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin.toml
          git commit -m "chore(release): ${{ steps.version.outputs.version }}"
          git push origin HEAD
      - name: Install gh-ship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh extension install noirbizarre/gh-ship
      - name: Validate release artifact
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh ship validate ship.release.json
      - uses: actions/upload-artifact@v7
        with:
          name: ship-release
          path: ship.release.json
          if-no-files-found: error
