name: 🚢 Ship github
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
permissions:
  contents: read
concurrency:
  group: ship
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.event_name == 'push' && github.repository == 'memcastle/memcastle-github' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      deployment: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install gh-ship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh extension install noirbizarre/gh-ship
      - name: Prepare release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh ship prepare
  release:
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.merged
        && github.event.pull_request.head.ref == 'release/next'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.repository == 'memcastle/memcastle-github' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: release
      deployment: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install gh-ship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh extension install noirbizarre/gh-ship
      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh ship release
