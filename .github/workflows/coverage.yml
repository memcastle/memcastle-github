name: 📊 github coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: memcastle/memcastle/.github/actions/core-binary@main
        with:
          version: main
      - name: Measure module tests
        id: reports
        run: python3 scripts/coverage.py
      - name: Upload coverage
        if: steps.reports.outputs.files != ''
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.reports.outputs.files }}
          use_oidc: true
          fail_ci_if_error: true
