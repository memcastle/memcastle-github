name: 🧩 github plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      archive:
        description: Built release archive relative to the repository root
        value: ${{ jobs.package.outputs.archive }}

permissions:
  contents: read

jobs:
  package:
    name: 🏗️ Build github
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.archive.outputs.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Build and package github
        run: python3 scripts/package.py
      - uses: memcastle/memcastle/.github/actions/core-binary@main
        with:
          version: main
      - name: Check this provider's modules
        run: python3 scripts/check_modules.py
      - name: Check reviewed artifact hashes and source locks
        run: |
          git diff --exit-code -- plugin.toml || { echo '::error::commit reviewed plugin.toml digests'; exit 1; }
          for manifest in modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              lock="$(dirname "$manifest")/Cargo.lock"
              git ls-files --error-unmatch "$lock" >/dev/null || { echo "::error::commit $lock"; exit 1; }
            fi
          done
      - name: Validate plugin metadata
        run: python3 -m unittest discover -s tests
      - name: Identify archive
        id: archive
        run: |
          path="$(python3 -c 'import tomllib; p=tomllib.load(open("plugin.toml", "rb"))["plugin"]; print("dist/{}-{}.tar.gz".format(p["id"], p["version"]))')"
          test -s "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: |
            dist/*.tar.gz
            modules/*/source.wasm
            modules/*/dist/**
          if-no-files-found: error

  validate:
    name: 🧪 Check with Core
    needs: package
    uses: memcastle/memcastle/.github/workflows/plugin-validation.yaml@main
    with:
      artifact-name: plugin-package
      archive-path: ${{ needs.package.outputs.archive }}
      # Add exact plugin-capable stable versions once available; main is always tested.
      core-versions: '[]'


  ship-validate:
    name: 🚢 Validate release workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gh-ship
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install noirbizarre/gh-ship
      - name: Validate gh-ship configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh ship validate

